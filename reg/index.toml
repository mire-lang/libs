# Registry index — mire-registry
# Each entry describes a published package version.
# Two install methods are supported:
#   method = "clone"   → owl git-clones the repo into ~/.owl/libs/<name>
#                        (ref pins a branch/tag; commit pins an exact SHA)
#   method = "release" → owl downloads the release asset from GitHub and
#                        verifies its SHA-256 before extracting
# `repo` may be a full URL or a "owner/name" GitHub shorthand.

[[packages]]
name = "mire"
version = "1.0.0"
description = "Core library for the Mire language — vec, map, str, maybe, result, arr, std macros"
author = "mire-lang"
compiler = ">=0.15.0"
abi = 1
language = ">=0.15.0"
method = "clone"
repo = "mire-lang/mire-lib"
ref = "main"
commit = "b5a23b4"

