# Registry index — MOR (Mire Official Registry)
# Each entry describes a published package version.
# Two install methods are supported:
#   method = "clone"   → owl git-clones the repo into ~/.owl/libs/<name>
#                        (ref pins a branch/tag; commit pins an exact SHA)
#   method = "release" → owl downloads the release asset from GitHub and
#                        verifies its SHA-256 before extracting
# `repo` may be a full URL or a "owner/name" GitHub shorthand.
#
# Multi-version packages use version-suffixed directory names:
#   ~/.owl/libs/<name>@<version>
# Default symlinks:
#   ~/.owl/libs/kioto  ->  ~/.owl/libs/kioto@3.1.0   (default = latest)
#   ~/.owl/libs/mire   ->  ~/.owl/libs/mire@2.0.0-beta (default = latest beta)

# ── kioto ─────────────────────────────────────────────────────────────
# 2.5.0 — stable, maintained on release/2.5.0 branch (separate, deprecated later)
# 3.1.0 — latest, default (main branch), symlink kioto -> kioto@3.1.0

[[packages]]
name = "kioto"
version = "2.5.0"
description = "Standard library for Mire — core types, collections, I/O, networking, crypto"
author = "mire-lang"
compiler = ">=0.15.0"
abi = 1
language = ">=0.15.0"
method = "clone"
repo = "mire-lang/Kioto"
ref = "release/2.5.0"
commit = ""
default = false
branch = "release/2.5.0"
install_path = "~/.owl/libs/kioto@2.5.0"

[[packages]]
name = "kioto"
version = "3.1.0"
description = "Standard library for Mire — core types, collections, I/O, networking, crypto"
author = "mire-lang"
compiler = ">=0.15.0"
abi = 1
language = ">=0.15.0"
method = "clone"
repo = "mire-lang/Kioto"
ref = "main"
commit = ""
default = true
branch = "main"
install_path = "~/.owl/libs/kioto@3.1.0"

# ── mire ──────────────────────────────────────────────────────────────
# 1.2.4 — previous stable, maintained on release/1.2.4 branch
