# MOR (Mire Official Registry) configuration

[registry]
name = "MOR"
description = "Official Mire package registry"
url = "https://github.com/mire-lang/libs"
url-raw = "https://raw.githubusercontent.com/mire-lang/libs/main/reg"

[cfg]
publisher = "publish.toml"
registry = "local"
cache = "~/.owl/cache"
libs = "~/.owl/libs"

# Default symlinks for multi-version packages
[symlinks]
kioto = "kioto@3.1.0"
mire = "mire@2.0.0-beta"

[exports]
# Internal module exports for registry operations

[dependencies]
# Registry dependencies (none)

["owl@lock"]
version = "3"
